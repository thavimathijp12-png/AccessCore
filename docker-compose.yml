services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: accesscore_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-accesscore_dev}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: accesscore_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-accesscore_dev}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      mysql:
        condition: service_healthy
