name: Frontend CI

on:
  push:
    branches: [ main ]
    paths: [ 'src/**', 'package.json', 'vite.config.js' ]
  pull_request:
    branches: [ main ]
    paths: [ 'src/**', 'package.json', 'vite.config.js' ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
