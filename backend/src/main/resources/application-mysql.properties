# ===================================================================
# ACCESSCORE Backend Production Profile Configuration (Live MySQL)
# ===================================================================

# Server Port
server.port=${SERVER_PORT:8080}

# Application Metadata
spring.application.name=accesscore-backend

# -------------------------------------------------------------------
# Real MySQL Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:accesscore_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate / JPA Configuration for MySQL
# Safely updates schema and creates tables if they do not exist
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
accesscore.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
accesscore.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# Logging Levels
# -------------------------------------------------------------------
logging.level.com.accesscore=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=TRACE
