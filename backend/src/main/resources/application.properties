# ===================================================================
# ACCESSCORE Backend Configuration
# ===================================================================

# Server Port
server.port=${SERVER_PORT:8080}

# Application Metadata
spring.application.name=accesscore-backend

# -------------------------------------------------------------------
# Database Configuration (MySQL 8.0 with automatic H2 fallback)
# Real credentials can be provided via DB_PASSWORD environment variable.
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:accesscore_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# Generates and updates schema dynamically based on entities
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
accesscore.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
accesscore.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# Logging Levels
# -------------------------------------------------------------------
logging.level.com.accesscore=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
